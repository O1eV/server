spring:
  application:
    name: O1vE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ove}
    username: ${DB_USERNAME:ove}
    password: ${DB_PASSWORD:ove}
  jpa:
    # 마이그레이션 도구(Flyway 등) 도입 전까지는 엔티티 기준으로 스키마를 맞춘다.
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  # HS256 서명 키. 32바이트(256bit) 이상이어야 하며 반드시 환경변수로 주입한다.
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d

paper-account:
  # 회원가입 시 만들어 주는 모의계좌 초기 잔고(KRW)
  initial-balance: 10000000

upbit:
  base-url: https://api.upbit.com
  # 업비트가 느려져도 요청 스레드가 오래 묶이지 않도록 짧게 둔다.
  connect-timeout: 500ms
  read-timeout: 1s
  # 종목 목록(/market/all)을 메모리에 들고 있는 시간
  markets-cache-ttl: 5m

collector:
  # 업비트 WebSocket 시세 수집기(체결 → 1분봉 → TimescaleDB·Redis). 운영 환경에서만 COLLECTOR_ENABLED=true로 켠다.
  # 꺼져 있으면(기본) 업비트에 연결하지도, candles 테이블을 만들지도 않는다.
  enabled: ${COLLECTOR_ENABLED:false}
  # 수집할 종목. 쉼표로 여러 개를 줄 수 있다.
  symbols: ${COLLECTOR_SYMBOLS:KRW-BTC,KRW-ETH,KRW-XRP}
  # 분이 끝난 뒤 이 시간이 지나야 봉을 마감한다(늦게 도착하는 체결을 기다리는 시간)
  grace-delay: 1500ms

