spring:
  application:
    name: O1vE
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ove}
    username: ${DB_USERNAME:ove}
    password: ${DB_PASSWORD:ove}
  jpa:
    # 마이그레이션 도구(Flyway 등) 도입 전까지는 엔티티 기준으로 스키마를 맞춘다.
    hibernate:
      ddl-auto: ${DDL_AUTO:update}
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  # HS256 서명 키. 32바이트(256bit) 이상이어야 하며 반드시 환경변수로 주입한다.
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d

auth:
  cookie:
    # refresh 토큰을 담는 HttpOnly 쿠키. Path 밖의 요청에는 브라우저가 쿠키를 보내지 않는다.
    name: refreshToken
    path: /api/auth
    # https가 아닌 로컬 개발에서만 AUTH_COOKIE_SECURE=false로 끈다. 운영에서는 true를 유지한다.
    secure: ${AUTH_COOKIE_SECURE:true}
    same-site: Lax

cors:
  # 쿠키(credentials)를 보내는 프론트 origin. 쉼표로 여러 개를 줄 수 있다.
  # 기본값의 8080은 로컬에서 Swagger UI(API와 같은 출처)로 재발급·로그아웃을 시험하기 위한 것이다.
  # 브라우저가 POST에 Origin을 붙여 보내서, 허용 목록에 없으면 403이 난다. 배포 환경에서는 실제 프론트 주소만 환경변수로 준다.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

paper-account:
  # 회원가입 시 만들어 주는 모의계좌 초기 잔고(KRW)
  initial-balance: 10000000

upbit:
  base-url: https://api.upbit.com
  # 업비트가 느려져도 요청 스레드가 오래 묶이지 않도록 짧게 둔다.
  connect-timeout: 500ms
  read-timeout: 1s
  # 종목 목록(/market/all)을 메모리에 들고 있는 시간
  markets-cache-ttl: 5m
  # 현재가는 1~2초만 캐시해서, 동시에 많은 요청이 와도 업비트 호출(IP당 초당 10회 한도)이 늘지 않게 한다.
  ticker-cache-ttl: 1500ms
  # 429(호출 한도 초과)를 받으면 이만큼 쉬었다가 한 번만 다시 시도한다.
  rate-limit-backoff: 300ms

collector:
  # 업비트 WebSocket 시세 수집기(체결 → 1분봉 → TimescaleDB·Redis). 운영 환경에서만 COLLECTOR_ENABLED=true로 켠다.
  # 꺼져 있으면(기본) 업비트에 연결하지도, candles 테이블을 만들지도 않는다.
  enabled: ${COLLECTOR_ENABLED:false}
  # 수집할 종목. 쉼표로 여러 개를 줄 수 있다.
  symbols: ${COLLECTOR_SYMBOLS:KRW-BTC,KRW-ETH,KRW-XRP}
  # 분이 끝난 뒤 이 시간이 지나야 봉을 마감한다(늦게 도착하는 체결을 기다리는 시간)
  grace-delay: 1500ms
  kiwoom:
    # 키움증권 REST API 주식 시세 수집기(장중 체결 → 1분봉 → TimescaleDB·Redis). 시세 조회 API만 쓴다.
    # 개인 App Key 1개를 본인 로컬에서만 쓰는 전제다. 기본은 꺼짐(KIWOOM_ENABLED=true로 켠다).
    enabled: ${KIWOOM_ENABLED:false}
    # 수집할 종목 코드(6자리). 쉼표로 여러 개
    symbols: ${KIWOOM_SYMBOLS:005930}
    # 키와 시크릿은 환경변수로만 준다(이 파일에 값을 적지 않는다)
    app-key: ${KIWOOM_APP_KEY:}
    app-secret: ${KIWOOM_APP_SECRET:}
    # 모의투자는 https://mockapi.kiwoom.com, wss://mockapi.kiwoom.com:10000/api/dostk/websocket (모의 키를 쓸 때만)
    rest-base-url: ${KIWOOM_REST_BASE_URL:https://api.kiwoom.com}
    web-socket-url: ${KIWOOM_WS_URL:wss://api.kiwoom.com:10000/api/dostk/websocket}
    # 재접속 뒤 분봉 REST(ka10080) 보충. 분봉 시각(cntr_tm)이 봉의 시작인지 끝인지 먼저 확인한 뒤
    # KIWOOM_MINUTE_BAR_LABEL=START 또는 END를 주고 KIWOOM_BACKFILL_ENABLED=true로 켠다.
    backfill-enabled: ${KIWOOM_BACKFILL_ENABLED:false}
    minute-bar-label: ${KIWOOM_MINUTE_BAR_LABEL:}
springdoc:
  # Swagger UI(/swagger-ui.html)와 OpenAPI 문서(/v3/api-docs) 노출 여부. 기본은 둘 다 켜짐(로컬 개발용).
  # 주의: 배포(외부 공개) 환경에서는 환경변수 SWAGGER_UI_ENABLED=false, API_DOCS_ENABLED=false가 필수다.
  #       기본값을 true로 둔 건 로컬 편의 때문이라, 환경변수를 빼먹으면 공개 서버에 Swagger UI와 /v3/api-docs가 그대로 열린다(SecurityConfig도 permitAll).
  # 참고: HTTPS 프록시(ALB·nginx 등) 뒤에서는 문서의 servers 주소가 http로 잡힐 수 있어 server.forward-headers-strategy=framework 설정이 필요하다.
  swagger-ui:
    enabled: ${SWAGGER_UI_ENABLED:true}
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
watchlist:
  # 회원 한 명이 등록할 수 있는 관심 종목 최대 개수
  max-size: 20
