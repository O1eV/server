name: Deploy to EC2

# main은 배포 브랜치다(직접 push 금지, PR 머지로만 갱신). main에 머지되면 자동 배포하고,
# 시연 전 임시 배포는 Actions 탭에서 수동 실행(workflow_dispatch)으로 한다.
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  id-token: write   # OIDC로 AWS 역할을 맡기 위해 필요
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  APP_REPOSITORY: ${{ vars.ECR_APP_REPOSITORY }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 이미지 빌드는 테스트를 건너뛰므로(-x test), 실패한 코드가 운영에 배포되지 않도록 여기서 먼저 테스트한다.
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Test
        run: ./gradlew test

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_APP_REPOSITORY }}:${{ github.sha }}
        run: |
          docker build -t "$IMAGE" .
          docker push "$IMAGE"
          echo "APP_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      # compose 파일은 저장소 것을 그대로 내려보낸다.
      # EC2에서 이미지 태그만 .env에 갱신하고 pull/up 한다. 나머지 .env 값은 서버에만 있다.
      # FRONT_IMAGE는 프론트 저장소가 푸시한 태그를 서버 .env에 그대로 둔다.
      - name: Deploy via SSM
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          DEPLOY_DIR: ${{ vars.EC2_DEPLOY_DIR }}
        run: |
          COMPOSE_B64=$(base64 < docker-compose.prod.yml | tr -d '\n')
          COMMANDS=$(jq -cn \
            --arg dir "$DEPLOY_DIR" --arg reg "$REGISTRY" --arg region "$AWS_REGION" --arg img "$APP_IMAGE" --arg compose "$COMPOSE_B64" \
            '[ "set -e",
               "cd \($dir)",
               "echo \($compose) | base64 -d > docker-compose.prod.yml",
               "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($reg)",
               "sed -i \"s|^APP_IMAGE=.*|APP_IMAGE=\($img)|\" .env",
               "docker compose -f docker-compose.prod.yml pull app nginx",
               "docker compose -f docker-compose.prod.yml up -d",
               "docker image prune -f" ]')
          CMD_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "commands=$COMMANDS" \
            --query Command.CommandId --output text)
          # pull + up 이 오래 걸릴 수 있어 직접 폴링한다(최대 10분). wait 기본값(약 100초)은 정상 배포도 실패로 만든다.
          STATUS=InProgress
          for _ in $(seq 1 120); do
            sleep 5
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Success|Failed|Cancelled|TimedOut) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Out:StandardOutputContent,Err:StandardErrorContent}'
          if [ "$STATUS" != "Success" ]; then
            echo "배포 명령이 성공하지 못했습니다: $STATUS" >&2
            exit 1
          fi
